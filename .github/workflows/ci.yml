name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run validator & pre-scanner unit tests
        run: npm run test:validators

      - name: Run live loopback benchmark & golden-diff proof suite
        run: npm run test:benchmarks

      - name: Validate sample audit ledger, paired benchmarks, and findings
        run: npm run validate:sample

      - name: Verify manifests, SVGs, and relative markdown links
        run: npm run check:repo
