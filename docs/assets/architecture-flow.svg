<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" role="img" aria-label="Six-phase closed-loop pipeline">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07131A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 Z" fill="#10B981"/>
    </marker>
  </defs>
  <rect width="920" height="260" rx="16" fill="url(#flowBg)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="28" y="34" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">6-Phase Closed-Loop Pipeline (With Deterministic Node Gate Scripts)</text>

  <!-- Row 1: Phases 1 -> 2 -> 3 -->
  <rect x="28" y="54" width="260" height="72" rx="10" fill="#111C2E" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="158" y="76" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="12" font-weight="700">1. RECON + PRE-SCAN</text>
  <text x="158" y="96" text-anchor="middle" fill="#CBD5E1" font-family="ui-sans-serif, sans-serif" font-size="11.5">scan-slop.cjs + 4 research agents</text>
  <text x="158" y="114" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="10.5">Gate: validate-workload-ledger</text>

  <line x1="288" y1="90" x2="322" y2="90" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="54" width="260" height="72" rx="10" fill="#111C2E" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="460" y="76" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="12" font-weight="700">2. BASELINE + GOLDEN</text>
  <text x="460" y="96" text-anchor="middle" fill="#CBD5E1" font-family="ui-sans-serif, sans-serif" font-size="11.5">Seed >=1k rows, paired cache_mode</text>
  <text x="460" y="114" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="10.5">Emit baseline.json + golden_sha256</text>

  <line x1="590" y1="90" x2="624" y2="90" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="632" y="54" width="260" height="72" rx="10" fill="#111C2E" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="762" y="76" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="12" font-weight="700">3. COVERAGE HUNTERS</text>
  <text x="762" y="96" text-anchor="middle" fill="#CBD5E1" font-family="ui-sans-serif, sans-serif" font-size="11.5">8 Slop Classes + Coverage Critic</text>
  <text x="762" y="114" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="10.5">Gate: --require-complete (100%)</text>

  <!-- Connector down from 3 to 4 -->
  <line x1="762" y1="126" x2="762" y2="152" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Phases 6 <- 5 <- 4 -->
  <rect x="632" y="160" width="260" height="76" rx="10" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <text x="762" y="182" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="12" font-weight="700">4. PROVE OR UNSLOP</text>
  <text x="762" y="202" text-anchor="middle" fill="#CBD5E1" font-family="ui-sans-serif, sans-serif" font-size="11">Minimal fix + after.json + guard</text>
  <text x="762" y="220" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="10.5">Gate: compare-benchmarks.cjs</text>

  <line x1="632" y1="198" x2="598" y2="198" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="160" width="260" height="76" rx="10" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <text x="460" y="182" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="12" font-weight="700">5. FRESH SKEPTIC</text>
  <text x="460" y="202" text-anchor="middle" fill="#CBD5E1" font-family="ui-sans-serif, sans-serif" font-size="11">Checks tie-breakers, nulls, tenants</text>
  <text x="460" y="220" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="10.5">Gate: validate-findings.cjs</text>

  <line x1="330" y1="198" x2="296" y2="198" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="28" y="160" width="260" height="76" rx="10" fill="#111C2E" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="158" y="182" text-anchor="middle" fill="#FCD34D" font-family="ui-monospace, monospace" font-size="12" font-weight="700">6. VERIFIED REPORTS</text>
  <text x="158" y="202" text-anchor="middle" fill="#CBD5E1" font-family="ui-sans-serif, sans-serif" font-size="11.5">REPORT.md + BENCHMARKS.md</text>
  <text x="158" y="220" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="10.5">FINDINGS-DETAIL + NEEDS-VALIDATION</text>
</svg>
