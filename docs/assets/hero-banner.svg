  <text x="118" y="94" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15.5">Eliminates N+1 cascades, full table scans, SELECT * bloat &amp; async waterfalls —</text>
  <text x="118" y="116" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15.5">every fix is gated by before/after telemetry and exact golden SHA-256 parity.</text>
